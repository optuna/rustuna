name: Checks and tests (Rust)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  rust_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
      - run: cargo clippy --locked --workspace --lib --bins --tests --examples --all-features -- -D warnings
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2
  rust_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - run: cargo test --locked --all-features

      - name: Install
        run: |
          uv pip install optuna
      - name: Run tests which require Python and Optuna
        working-directory: rustuna_storage
        run: |
          cargo test --locked -- --ignored
