name: checks-action

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Report findings as pull request annotations instead of uploading a SARIF file, which
          # would require GitHub code scanning to be enabled for this repository. To switch, drop
          # both inputs below and grant the job `security-events: write` instead.
          advanced-security: false
          annotations: true

