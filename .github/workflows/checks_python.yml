name: Checks and tests (Python)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  python_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Install dependencies
        working-directory: rustuna_pyo3
        run: uv sync --group dev
      - name: ruff
        working-directory: rustuna_pyo3
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        working-directory: rustuna_pyo3
        run: uv run mypy rustuna/ python_examples/ tests/
  python_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - name: Install Python packages
        working-directory: rustuna_pyo3
        run: |
          uv sync --group dev
      - name: Run tests
        working-directory: rustuna_pyo3
        run: uv run --no-sync pytest tests/
