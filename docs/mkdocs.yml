site_name: Rustuna Documentation
site_description: Fast hyperparameter optimization library written in Rust
site_url: https://optuna.github.io/rustuna/

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/optuna-white-square.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source

nav:
  - Home: index.md
  - Tutorial:
      - Getting Started: tutorial/getting-started.md
  - API Reference:
      - Study: api/study.md
      - Trial: api/trial.md
      - Sampler: api/sampler.md
      - Storage: api/storage.md
      - Trial Queue: api/trial_queue.md
      - Importance: api/importance.md
      - Distribution: api/distribution.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
